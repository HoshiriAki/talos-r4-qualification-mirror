[package]
name = "feature-tenant-simulation"
version = "0.1.0"
edition = "2024"
description = "Talos isolated tenant simulation overlay runtime"

[dependencies]
system-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid.workspace = true
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

sqlx = { version = "0.8", optional = true, default-features = false, features = ["postgres", "runtime-tokio", "chrono"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

[features]
default = []
postgres = ["dep:sqlx", "dep:tokio"]
