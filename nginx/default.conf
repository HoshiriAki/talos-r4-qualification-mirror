server {
    listen 80;
    server_name _;

    # SPA static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location /users/ { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location /devices/ { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location /meta/ { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location /health { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location /metrics { proxy_pass http://app:8080; proxy_set_header Host $host; }
}
