services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: talos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: talos
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talos -d talos"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      backend:
        ipv4_address: 172.29.0.10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DB_BACKEND: postgres
      DATABASE_URL: ${TALOS_PRODUCTION_DATABASE_URL:?TALOS_PRODUCTION_DATABASE_URL is required}
      PUBLIC_DIR: /app/public
      PUBLIC_HTTPS: "true"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      TRUSTED_PROXY_COUNT: "1"
      TRUSTED_PROXY_CIDRS: 172.29.0.0/24
      METRICS_SCRAPE_TOKEN_FILE: /run/secrets/talos_metrics_scrape_token
      METRICS_SCRAPE_PEER: "172.29.0.40"
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - talos_metrics_scrape_token
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.29.0.20

  nginx:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    depends_on:
      - app
    ports:
      - "127.0.0.1:${TALOS_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${TALOS_HTTPS_PORT:-8443}:443"
    volumes:
      - ../nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?TLS_CERT_FILE is required}:/etc/talos/tls/tls.crt:ro
      - ${TLS_KEY_FILE:?TLS_KEY_FILE is required}:/etc/talos/tls/tls.key:ro
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.29.0.30

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - talos_metrics_scrape_token
    ports:
      - "127.0.0.1:${TALOS_PROMETHEUS_PORT:-9090}:9090"
    networks:
      backend:
        ipv4_address: 172.29.0.40

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:${TALOS_GRAFANA_PORT:-3000}:3000"
    networks:
      - backend

networks:
  backend:
    ipam:
      config:
        - subnet: 172.29.0.0/24

secrets:
  talos_metrics_scrape_token:
    file: ${METRICS_SCRAPE_TOKEN_FILE:?METRICS_SCRAPE_TOKEN_FILE is required}

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
