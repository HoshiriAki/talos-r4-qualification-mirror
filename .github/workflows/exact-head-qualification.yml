name: TALOS Exact-Head Qualification

on:
  pull_request:
    branches:
      - prototype
      - 'agent/r4-p*-*'
    types:
      - ready_for_review
  workflow_dispatch:
    inputs:
      source_commit_sha:
        description: Private authoritative source commit SHA for clean-history mirror qualification
        required: false
        type: string
      source_tree_sha:
        description: Private authoritative source root tree SHA; enables mirror mode when set
        required: false
        type: string
      source_repository:
        description: Private authoritative source repository identity for provenance
        required: false
        type: string
      package_branch:
        description: Private source branch identity used to resolve current-package qualification in mirror mode
        required: false
        type: string
      repair_id:
        description: Traceable mirror repair identity; enables bounded divergent-tree qualification
        required: false
        type: string
      repair_origin_mirror_sha:
        description: Parentless mirror snapshot SHA that binds the authoritative source tree
        required: false
        type: string
      repair_base_sha:
        description: Immediate pre-repair mirror commit SHA
        required: false
        type: string
  workflow_call:
    inputs:
      source_commit_sha:
        required: false
        type: string
      source_tree_sha:
        required: false
        type: string
      source_repository:
        required: false
        type: string
      package_branch:
        required: false
        type: string
      repair_id:
        required: false
        type: string
      repair_origin_mirror_sha:
        required: false
        type: string
      repair_base_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: talos-exact-head-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '2'

jobs:
  preflight:
    name: Exact-head preflight
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify exact HEAD or exact-tree mirror
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha || '' }}
          SOURCE_TREE_SHA: ${{ inputs.source_tree_sha || '' }}
          REPAIR_ID: ${{ inputs.repair_id || '' }}
          REPAIR_ORIGIN_MIRROR_SHA: ${{ inputs.repair_origin_mirror_sha || '' }}
          REPAIR_BASE_SHA: ${{ inputs.repair_base_sha || '' }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ -n "$SOURCE_TREE_SHA" ]]; then
            test -n "$SOURCE_COMMIT_SHA"
            if [[ -n "$REPAIR_ID" ]]; then
              test -n "$REPAIR_ORIGIN_MIRROR_SHA"
              test -n "$REPAIR_BASE_SHA"
              git cat-file -e "${REPAIR_ORIGIN_MIRROR_SHA}^{commit}"
              git cat-file -e "${REPAIR_BASE_SHA}^{commit}"
              origin_tree="$(git rev-parse "${REPAIR_ORIGIN_MIRROR_SHA}^{tree}")"
              test "$origin_tree" = "$SOURCE_TREE_SHA"
              test "$(git rev-parse "${actual}^")" = "$REPAIR_BASE_SHA"
              git merge-base --is-ancestor "$REPAIR_ORIGIN_MIRROR_SHA" "$actual"
              echo "MIRROR_REPAIR_ID=$REPAIR_ID"
              echo "MIRROR_REPAIR_ORIGIN=$REPAIR_ORIGIN_MIRROR_SHA"
              echo "MIRROR_REPAIR_BASE=$REPAIR_BASE_SHA"
              echo "MIRROR_REPAIR_TREE=$actual_tree"
            else
              test "$actual_tree" = "$SOURCE_TREE_SHA"
            fi
            echo "MIRROR_TRANSPORT_HEAD=$actual"
            echo "SOURCE_COMMIT_SHA=$SOURCE_COMMIT_SHA"
            echo "SOURCE_TREE_SHA=$SOURCE_TREE_SHA"
            echo "TALOS_OPS_STRICT_ZERO_DEBT=1" >> "$GITHUB_ENV"
            echo "TALOS_OPS_BASELINE_MODE=strict-zero-debt"
          else
            test -z "$REPAIR_ID"
            test "$actual" = "$EXPECTED_HEAD"
            git fetch --no-tags origin prototype:refs/remotes/origin/prototype
            echo "EXACT_HEAD=$actual"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository policy and structure
        run: |
          pnpm quality:ci-policy:test
          pnpm quality:ci-policy
          pnpm quality:ci-package:test
          pnpm quality:ci-package
          pnpm quality:layout
          pnpm quality:public-surface:test
          pnpm quality:public-surface
          pnpm quality:talos-ops
          pnpm ui:registry:check

      - name: Validate R4 legacy compatibility closure
        run: |
          node scripts/check-r4-legacy-closure.test.mjs
          node scripts/check-r4-legacy-closure.mjs

      - name: Validate R4 Interconnect stable core
        run: |
          node scripts/check-r4-interconnect-fabric.test.mjs
          node scripts/check-r4-interconnect-fabric.mjs

      - name: Validate R4 public Web/API governance
        run: |
          pnpm quality:r4-public-api:test
          pnpm quality:r4-public-api

      - name: Validate R4 network authority
        run: |
          pnpm quality:r4-network:test
          pnpm quality:r4-network

      - name: Validate R4 plugin permission and isolation
        run: |
          pnpm quality:r4-plugin:test
          pnpm quality:r4-plugin

      - name: Validate R4 platform security hardening
        run: |
          pnpm quality:r4-platform-security:test
          pnpm quality:r4-platform-security

      - name: Validate R4 PostgreSQL 18 production cutover structure
        run: |
          node scripts/check-r4-p8-production-persistence.test.mjs
          node scripts/check-r4-p8-production-persistence.mjs
