      - name: Check exact-head or mirror-repair whitespace authority
        shell: bash
        env:
          SOURCE_TREE_SHA: ${{ inputs.source_tree_sha || '' }}
          REPAIR_ID: ${{ inputs.repair_id || '' }}
          REPAIR_BASE_SHA: ${{ inputs.repair_base_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TREE_SHA" ]]; then
            git diff --check origin/prototype...HEAD
          elif [[ -n "$REPAIR_ID" ]]; then
            test -n "$REPAIR_BASE_SHA"
            git diff --check "${REPAIR_BASE_SHA}...HEAD"
          else
            echo "Exact-tree mirror mode uses the private exporter preflight git diff --check before the parentless tree is pushed."
          fi

  quality:
    name: Exact-head quality and PostgreSQL 18
    needs: preflight
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: talos
          POSTGRES_PASSWORD: talos-ci-only
          POSTGRES_DB: talos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talos -d talos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TALOS_TEST_POSTGRES_URL: postgresql://talos:talos-ci-only@127.0.0.1:5432/talos_test

    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify exact HEAD or exact-tree mirror
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha || '' }}
          SOURCE_TREE_SHA: ${{ inputs.source_tree_sha || '' }}
          REPAIR_ID: ${{ inputs.repair_id || '' }}
          REPAIR_ORIGIN_MIRROR_SHA: ${{ inputs.repair_origin_mirror_sha || '' }}
          REPAIR_BASE_SHA: ${{ inputs.repair_base_sha || '' }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ -n "$SOURCE_TREE_SHA" ]]; then
            test -n "$SOURCE_COMMIT_SHA"
            if [[ -n "$REPAIR_ID" ]]; then
              test -n "$REPAIR_ORIGIN_MIRROR_SHA"
              test -n "$REPAIR_BASE_SHA"
              git cat-file -e "${REPAIR_ORIGIN_MIRROR_SHA}^{commit}"
              git cat-file -e "${REPAIR_BASE_SHA}^{commit}"
              origin_tree="$(git rev-parse "${REPAIR_ORIGIN_MIRROR_SHA}^{tree}")"
              test "$origin_tree" = "$SOURCE_TREE_SHA"
              test "$(git rev-parse "${actual}^")" = "$REPAIR_BASE_SHA"
              git merge-base --is-ancestor "$REPAIR_ORIGIN_MIRROR_SHA" "$actual"
              echo "MIRROR_REPAIR_ID=$REPAIR_ID"
              echo "MIRROR_REPAIR_ORIGIN=$REPAIR_ORIGIN_MIRROR_SHA"
              echo "MIRROR_REPAIR_BASE=$REPAIR_BASE_SHA"
              echo "MIRROR_REPAIR_TREE=$actual_tree"
            else
              test "$actual_tree" = "$SOURCE_TREE_SHA"
            fi
            echo "MIRROR_TRANSPORT_HEAD=$actual"
            echo "SOURCE_COMMIT_SHA=$SOURCE_COMMIT_SHA"
            echo "SOURCE_TREE_SHA=$SOURCE_TREE_SHA"
          else
            test -z "$REPAIR_ID"
            test "$actual" = "$EXPECTED_HEAD"
            git fetch --no-tags origin prototype:refs/remotes/origin/prototype
            echo "EXACT_HEAD=$actual"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable pinned 2026-09-12
        with:
          components: rustfmt,clippy

      - name: Frontend build and dependency audit
        run: |
          pnpm --dir frontend typecheck
          pnpm --dir frontend build
          pnpm audit --audit-level high

      - name: Rust format, workspace check, tests and provenance binary
        working-directory: backend
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked --no-fail-fast
          cargo build --locked --bin talos-backend

      - name: PostgreSQL feature and migration schema
        working-directory: backend
        run: |
          cargo check --workspace --no-default-features --features postgres --locked
          cargo test --features postgres --bin talos-backend db::migrations_pg --locked
          cargo test --features postgres --bin talos-backend db::r4_migrations --locked

      - name: Live PostgreSQL 18 fresh production migration evidence
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ../.talos-evidence
          log=../.talos-evidence/pg18-fresh-production-migration.log
