          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha || '' }}
          SOURCE_TREE_SHA: ${{ inputs.source_tree_sha || '' }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository || '' }}
          REPAIR_ID: ${{ inputs.repair_id || '' }}
          REPAIR_ORIGIN_MIRROR_SHA: ${{ inputs.repair_origin_mirror_sha || '' }}
          REPAIR_BASE_SHA: ${{ inputs.repair_base_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_TREE_SHA" ]]; then
            test -n "$SOURCE_COMMIT_SHA"
            test -n "$SOURCE_REPOSITORY"
            repair_args=()
            if [[ -n "$REPAIR_ID" ]]; then
              repair_args=(
                --repair-id "$REPAIR_ID"
                --repair-origin-mirror-sha "$REPAIR_ORIGIN_MIRROR_SHA"
                --repair-base-sha "$REPAIR_BASE_SHA"
              )
            fi
            node scripts/r4-build-provenance.mjs generate \
              --source-sha "$SOURCE_COMMIT_SHA" \
              --source-tree-sha "$SOURCE_TREE_SHA" \
              --repository "$SOURCE_REPOSITORY" \
              "${repair_args[@]}" \
              --artifact public \
              --artifact backend/target/debug/talos-backend \
              --output .talos-provenance/exact-head.json
            node scripts/r4-build-provenance.mjs verify \
              --manifest .talos-provenance/exact-head.json \
              --source-sha "$SOURCE_COMMIT_SHA" \
              --source-tree-sha "$SOURCE_TREE_SHA"
          else
            node scripts/r4-build-provenance.mjs generate \
              --source-sha "$EXPECTED_HEAD" \
              --artifact public \
              --artifact backend/target/debug/talos-backend \
              --output .talos-provenance/exact-head.json
            node scripts/r4-build-provenance.mjs verify \
              --manifest .talos-provenance/exact-head.json \
              --source-sha "$EXPECTED_HEAD"
          fi

