          name: exact-head-build-provenance
          path: |
            .talos-provenance/exact-head.json
            .talos-provenance/exact-head.json.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Final exact-head whitespace check
        if: ${{ inputs.source_tree_sha == '' }}
        run: git diff --check origin/prototype...HEAD

  package_qualification:
    name: Current package qualification
    needs: [preflight, quality]
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name != 'pull_request' && inputs.package_branch != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify package qualification source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha || '' }}
          SOURCE_TREE_SHA: ${{ inputs.source_tree_sha || '' }}
          REPAIR_ID: ${{ inputs.repair_id || '' }}
          REPAIR_ORIGIN_MIRROR_SHA: ${{ inputs.repair_origin_mirror_sha || '' }}
          REPAIR_BASE_SHA: ${{ inputs.repair_base_sha || '' }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ -n "$SOURCE_TREE_SHA" ]]; then
            test -n "$SOURCE_COMMIT_SHA"
            if [[ -n "$REPAIR_ID" ]]; then
              test -n "$REPAIR_ORIGIN_MIRROR_SHA"
              test -n "$REPAIR_BASE_SHA"
              test "$(git rev-parse "${REPAIR_ORIGIN_MIRROR_SHA}^{tree}")" = "$SOURCE_TREE_SHA"
              test "$(git rev-parse "${actual}^")" = "$REPAIR_BASE_SHA"
              git merge-base --is-ancestor "$REPAIR_ORIGIN_MIRROR_SHA" "$actual"
              echo "PACKAGE_MIRROR_REPAIR_ID=$REPAIR_ID"
            else
              test "$actual_tree" = "$SOURCE_TREE_SHA"
            fi
            echo "PACKAGE_MIRROR_TRANSPORT_HEAD=$actual"
          else
            test -z "$REPAIR_ID"
            test "$actual" = "$EXPECTED_HEAD"
            echo "EXACT_HEAD=$actual"
          fi

      - name: Resolve current package qualification
        id: package
        shell: bash
        env:
          HEAD_REF: ${{ inputs.package_branch || github.head_ref }}
        run: |
          set -euo pipefail
          node scripts/ci-package-qualification.mjs \
            --branch "$HEAD_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Execute current package checks and qualification
        if: steps.package.outputs.required == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ inputs.package_branch || github.head_ref }}
        run: |
          set -euo pipefail
          node scripts/ci-run-package-qualification.mjs --branch "$HEAD_REF"

      - name: Upload current package evidence
        if: github.event_name == 'pull_request' && steps.package.outputs.required == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-package-${{ steps.package.outputs.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .talos-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Record no package-specific qualification
        if: steps.package.outputs.required != 'true'
        run: echo "No package-specific qualification is registered for this non-SP branch."
