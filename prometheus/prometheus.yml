global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'talos-backend'
    static_configs:
      - targets: ['app:8080']
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/talos_metrics_scrape_token

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
